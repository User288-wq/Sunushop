<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SunuShop</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0fdf4;
      font-family: Arial, sans-serif;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 48px;
      margin: 0;
      color: #1a1a2e;
    }
    h1 span {
      color: #22c55e;
    }
    p {
      font-size: 24px;
      color: #6b7280;
      margin: 10px 0 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://www.sunu-shop.org/images/logo.svg" alt="SunuShop" class="logo" />
    <h1>Sunu<span>Shop</span></h1>
    <p>🇸🇳 La marketplace sénégalaise</p>
  </div>
</body>
</html>
